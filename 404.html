<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=/" />
    <title>Redirecionando...</title>
  </head>
  <body>
    <script>
      // Captura a URL atual
      var path = window.location.pathname;
      // Remove a parte do domínio
      var cleanPath = path.replace("/api-cifras-adventistas", "");
      // Redireciona para a raiz com o caminho limpo
      window.location.replace("/api-cifras-adventistas" + cleanPath);
    </script>
  </body>
